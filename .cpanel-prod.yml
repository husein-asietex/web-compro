---
deployment:
  tasks:
    - export APPPATH=/home/asietexc/web-compro-prod
    - /bin/mkdir -p $APPPATH
    - /bin/cp -R server.js package.json $APPPATH/
    - /bin/cp -R .next $APPPATH/
    - /bin/cp -R public $APPPATH/
    - /bin/cp -R node_modules $APPPATH/
    - /bin/mkdir -p $APPPATH/tmp
    - /bin/touch $APPPATH/tmp/restart.txt